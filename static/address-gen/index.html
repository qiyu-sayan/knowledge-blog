<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机地址生成器</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #fffdf9;
      --ink: #1f1a14;
      --muted: #6b645c;
      --line: #e4dccf;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }
    .wrap { width: min(100% - 1.5rem, 860px); margin: 0 auto; padding: 1.25rem 0 2.5rem; }
    header.site {
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    header.site .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 0;
    }
    h1 { font-size: 1.55rem; margin: 0; }
    .lead { color: var(--muted); font-size: 0.95rem; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 1.15rem 0;
      align-items: center;
    }
    .toolbar input[type="number"] {
      width: 100px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin: 0.75rem 0;
    }
    .card h3 { margin: 0 0 0.55rem; font-size: 1.02rem; }
    .row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 6px 12px;
      font-size: 0.95rem;
    }
    .k { color: var(--muted); }
    .v { word-break: break-all; }
    .actions { display: flex; gap: 8px; margin-top: 0.75rem; flex-wrap: wrap; }
    .actions .btn { padding: 8px 14px; font-size: 13px; }
    .note {
      color: var(--muted);
      font-size: 0.88rem;
      margin: 1.25rem 0 0;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .tabs button {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      font-size: 14px;
    }
    .tabs button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .stat {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
      font-size: 0.92rem;
    }
    @media (max-width: 640px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .btn { width: 100%; }
      .row { grid-template-columns: 1fr; }
      .k { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div>
        <h1>随机地址生成器</h1>
        <div class="lead">虚拟城市 · 多街区多门牌 · 测试 / 演示用</div>
      </div>
      <a class="btn btn-ghost" href="/p/address-generator/" style="text-decoration:none">使用说明</a>
    </div>
  </header>

    <div class="tabs" id="regionTabs">

      <button type="button" data-region="cn">中国</button>
    </div>

    <div class="toolbar">
      <label class="lead">条数（最多 200）</label>

      <button class="btn" id="genBtn">生成</button>
      <button class="btn btn-ghost" id="copyAll">复制全部</button>
      <button class="btn btn-ghost" id="clearBtn">清空</button>
    </div>

    <div id="stat" class="stat"></div>
    <div id="list"></div>

    </p>
  </div>

    let region = "us";

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randInt(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function generateOne() {
      const d = DATA[region];
      const first = pick(d.first);
      const last = pick(d.last);
      const city = pick(d.cities);

      if (region === "cn") {
        const street = pick(d.streets) + pick(d.streetType);
        const num = randInt(1, 2888);
        const unit = randInt(1, 28);
        const room = randInt(101, 3206);
        return {
          姓名: last + first,
          手机: pick(["138","139","150","151","186","188","199","177"]) + String(randInt(10000000, 99999999)),
          省市: city[0],
          区县: city[3],
          地址: `${street}${num}号 ${unit}幢 ${room}室`,
          邮编: city[2],
          邮箱: `${randInt(10000, 9999999)}@${pick(d.emailDomain)}`,
          公司: pick(d.company)
        };
      }

      const house = randInt(1, 4998);
      const street = `${house} ${pick(d.streetWords)} ${pick(d.streetType)}`;
      const emailBase = `${first.toLowerCase()}.${last.toLowerCase()}${randInt(1, 999)}`;

      if (region === "uk") {
        return {
          Name: `${first} ${last}`,
          Street: street,
          City: city[0],
          County: city[1],
          Postcode: city[2],
          Phone: `07${randInt(700, 999)} ${randInt(100000, 999999)}`,
          Email: `${emailBase}@${pick(d.emailDomain)}`,
          Company: pick(d.company)
        };
      }

      return {
        Name: `${first} ${last}`,
        Street: street,
        City: city[0],
        State: city[1],
        ZIP: city[2],
        Phone: `(${randInt(201, 989)}) ${randInt(201, 989)}-${randInt(1000, 9999)}`,
        Email: `${emailBase}@${pick(d.emailDomain)}`,
        Company: pick(d.company)
      };
    }

    function stats() {
      const d = DATA[region];
      return `当前库：姓 ${d.last.length} × 名 ${d.first.length} × 街道词 ${d.streetWords.length} × 城市 ${d.cities.length}，理论组合远超普通社区规模。`;
    }

    function render() {
      const n = Math.max(1, Math.min(200, parseInt(document.getElementById("count").value, 10) || 12));
      document.getElementById("stat").textContent = stats();
      const list = document.getElementById("list");
      list.innerHTML = "";
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) {
        const data = generateOne();
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h3");
        h.textContent = `#${i + 1}`;
        card.appendChild(h);
        const row = document.createElement("div");
        row.className = "row";
        Object.keys(data).forEach((k) => {
          const a = document.createElement("div");
          a.className = "k";
          a.textContent = k;
          const b = document.createElement("div");
          b.className = "v";
          b.textContent = data[k];
          row.appendChild(a);
          row.appendChild(b);
        });
        card.appendChild(row);
        const act = document.createElement("div");
        act.className = "actions";
        const copyBtn = document.createElement("button");
        copyBtn.className = "btn btn-ghost";
        copyBtn.textContent = "复制本条";
        copyBtn.onclick = () => {
          const text = Object.entries(data).map(([k, v]) => `${k}: ${v}`).join("\n");
          navigator.clipboard.writeText(text);
          copyBtn.textContent = "已复制";
          setTimeout(() => (copyBtn.textContent = "复制本条"), 1200);
        };
        act.appendChild(copyBtn);
        card.appendChild(act);
        frag.appendChild(card);
      }
      list.appendChild(frag);
    }

    document.getElementById("genBtn").onclick = render;
    document.getElementById("clearBtn").onclick = () => {
      document.getElementById("list").innerHTML = "";
      document.getElementById("stat").textContent = "";
    };
    document.getElementById("copyAll").onclick = async () => {
      const cards = document.querySelectorAll("#list .card");
      const out = [];
      cards.forEach((c) => {
        const ks = [...c.querySelectorAll(".k")].map((e) => e.textContent);
        const vs = [...c.querySelectorAll(".v")].map((e) => e.textContent);
        ks.forEach((k, i) => out.push(`${k}: ${vs[i]}`));
        out.push("");
      });
      await navigator.clipboard.writeText(out.join("\n"));
      const btn = document.getElementById("copyAll");
      btn.textContent = "已复制";
      setTimeout(() => (btn.textContent = "复制全部"), 1200);
    };

    document.querySelectorAll("#regionTabs [data-region]").forEach((btn) => {
      btn.addEventListener("click", () => {
        region = btn.getAttribute("data-region");
        document.querySelectorAll("#regionTabs [data-region]").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        render();
      });
    });

    render();

</html>
